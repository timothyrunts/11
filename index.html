<!DOCTYPE html>
<html>
<head>
    <title>Website Wrapper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .ad-container {
            width: 100%;
            z-index: 10;
            position: relative;
        }
        .iframe-container {
            width: 100%;
            height: calc(100% - 100px); /* Leave space for the ad */
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6561503879269814"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="ad-container">
        <!-- Display -->
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-6561503879269814"
            data-ad-slot="2044506538"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <div class="iframe-container">
        <iframe src="https://gausga.com"></iframe>
    </div>
</body>
</html>
