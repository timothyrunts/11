<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Single Page Website with Ads</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    nav {
      background: #333;
      color: white;
      padding: 1em;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .page {
      display: none;
      padding: 2em;
    }
    .active {
      display: block;
    }
    footer {
      background: #eee;
      text-align: center;
      padding: 1em;
      margin-top: 2em;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6561503879269814"
    crossorigin="anonymous"></script>
</head>
<body>

  <nav>
    <a href="#" onclick="showPage('home')">Home</a>
    <a href="#" onclick="showPage('about')">About</a>
    <a href="#" onclick="showPage('services')">Services</a>
    <a href="#" onclick="showPage('contact')">Contact</a>
  </nav>

  <!-- Google AdSense Display Ad -->
  <div style="margin: 20px auto; text-align: center;">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-6561503879269814"
         data-ad-slot="2044506538"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <!-- Page Sections -->
  <div id="home" class="page active">
    <h1>Welcome to My Website</h1>
    <p>This is the home page.</p>
  </div>

  <div id="about" class="page">
    <h1>About Us</h1>
    <p>We are a company that does amazing things!</p>
  </div>

  <div id="services" class="page">
    <h1>Our Services</h1>
    <p>We offer web development, design, and consulting.</p>
  </div>

  <div id="contact" class="page">
    <h1>Contact Us</h1>
    <p>Email us at contact@example.com</p>
  </div>

  <footer>
    &copy; 2025 My Website. All rights reserved.
  </footer>

  <script>
    function showPage(pageId) {
      const pages = document.querySelectorAll('.page');
      pages.forEach(page => page.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }
  </script>

</body>
</html>
